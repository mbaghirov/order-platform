server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: order-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/orders_db}
    username: ${DB_USERNAME:orderplatform}
    password: ${DB_PASSWORD:orderplatform}

  jpa:
    hibernate:
      ddl-auto: none          # schema is managed by Flyway
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

  cache:
    type: redis

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: false
        enable.idempotence: true

app:
  kafka:
    topic:
      order-events: order-events
  discount:
    enabled: true
    threshold: 100     # orders of 100.00 or more ...
    percent: 10        # ... get 10% off

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html
